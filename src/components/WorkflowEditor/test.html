<html>
  <head>
    <style>
      body{
        padding: 0;
        margin: 0;
      }
      .container{
        width: 1000px;
        margin: 0 auto;
        overflow: auto;
        background: #eee;
        padding: 24px;
        flex-direction: column;
        align-items: center;
      }
      .item{
        text-align: center;
      }
      .flex{
        display: flex;
        flex-wrap: nowrap;
        gap: 16px;
      }
      .child{
        flex: 0 0 auto;
        width: 50%;
        height: 100px;
        background: red;
      }
      .child:first-child{
        margin-left: auto;
      }
      .child:last-child{
        margin-right: auto;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="item">center this?</div>
       <div class="flex">
        <div class="child">child 1</div>
        <div class="child">child 2</div>
        <div class="child">child 3</div>
      </div>
    </div>
  </body>
</html>
